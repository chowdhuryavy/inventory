<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title><?= typeof companyName !== 'undefined' ? companyName : 'Inventory System' ?> - Users</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            font-size: 16px;
        }

        .users-container {
            padding: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        .header .company-logo {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header h1 {
            color: #4a5568;
            margin-bottom: 5px;
            font-size: 2rem;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .nav-btn {
            background: #4299e1;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            min-height: 44px;
        }

        .nav-btn:hover {
            background: #3182ce;
            transform: translateY(-2px);
        }

        .nav-btn.back {
            background: #38a169;
        }

        .nav-btn.add {
            background: #38a169;
        }

        .users-table {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f7fafc;
            font-weight: 600;
            color: #4a5568;
        }

        tr:hover {
            background: #f7fafc;
        }

        .role-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .role-super-admin {
            background: #fed7d7;
            color: #c53030;
        }

        .role-admin {
            background: #fef5e7;
            color: #d69e2e;
        }

        .role-cashier {
            background: #e6fffa;
            color: #319795;
        }

        .status-active {
            color: #38a169;
            font-weight: 600;
        }

        .status-inactive {
            color: #e53e3e;
            font-weight: 600;
        }

        .action-btn {
            background: #4299e1;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            margin: 0 2px;
        }

        .action-btn.edit {
            background: #ed8936;
        }

        .action-btn.delete {
            background: #e53e3e;
        }

        .action-btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #718096;
        }

        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #4299e1;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .users-container {
                padding: 10px;
            }

            .nav-buttons {
                flex-direction: column;
                align-items: center;
            }

            .nav-btn {
                width: 100%;
                max-width: 300px;
            }

            table {
                font-size: 0.8rem;
            }

            th, td {
                padding: 8px 4px;
            }
        }
    </style>
</head>
<body>
    <div class="users-container">
        <div class="header">
            <div class="company-logo"><?= typeof logo !== 'undefined' ? logo : '👥' ?></div>
            <h1><?= typeof companyName !== 'undefined' ? companyName : 'Inventory System' ?></h1>
            <div style="color: #718096; font-style: italic;">User Management</div>
            
            <div class="nav-buttons">
                <button class="nav-btn back" onclick="goToDashboard()">🏠 Dashboard</button>
                <button class="nav-btn add" onclick="addUser()">➕ Add User</button>
                <button class="nav-btn" onclick="showReports()">📊 Reports</button>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            Loading users...
        </div>

        <div class="users-table" id="usersTable" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Date Added</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersBody">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const sessionToken = '<?= sessionToken ?>';
        const appUrl = '<?= appUrl ?>';
        const currentUserRole = '<?= user.role ?>';
        let usersData = [];

        window.onload = function() {
            loadUsers();
        };

        function loadUsers() {
            fetch(appUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `action=getUsers&sessionToken=${sessionToken}`
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                if (data.success) {
                    usersData = data.data || [];
                    displayUsers(usersData);
                } else {
                    alert('Error loading users: ' + data.error);
                }
            })
            .catch(error => {
                document.getElementById('loading').style.display = 'none';
                console.error('Error:', error);
                alert('Error loading users');
            });
        }

        function displayUsers(data) {
            const tbody = document.getElementById('usersBody');
            const table = document.getElementById('usersTable');
            
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px;">No users found</td></tr>';
            } else {
                data.forEach(user => {
                    const row = tbody.insertRow();
                    
                    // Determine if current user can edit/delete this user
                    const canEdit = canEditUser(user.role);
                    const canDelete = canDeleteUser(user.role);
                    
                    row.innerHTML = `
                        <td>${user.email || ''}</td>
                        <td>${user.name || ''}</td>
                        <td><span class="role-badge role-${user.role.toLowerCase().replace(' ', '-')}">${user.role || ''}</span></td>
                        <td><span class="status-${user.status.toLowerCase()}">${user.status || ''}</span></td>
                        <td>${user.dateAdded || ''}</td>
                        <td>
                            <button class="action-btn edit" onclick="editUser('${user.email}')" ${!canEdit ? 'disabled' : ''}>Edit</button>
                            <button class="action-btn delete" onclick="deleteUser('${user.email}')" ${!canDelete ? 'disabled' : ''}>Delete</button>
                        </td>
                    `;
                });
            }
            
            table.style.display = 'block';
        }

        function canEditUser(targetRole) {
            if (currentUserRole === 'Super Admin') return true;
            if (currentUserRole === 'Admin' && targetRole !== 'Super Admin') return true;
            return false;
        }

        function canDeleteUser(targetRole) {
            if (currentUserRole === 'Super Admin' && targetRole !== 'Super Admin') return true;
            if (currentUserRole === 'Admin' && targetRole === 'Cashier') return true;
            return false;
        }

        function goToDashboard() {
            window.location.href = `${appUrl}?page=dashboard&sessionToken=${sessionToken}`;
        }

        function showReports() {
            window.location.href = `${appUrl}?page=reports&sessionToken=${sessionToken}`;
        }

        function addUser() {
            // TODO: Implement add user modal/page
            alert('Add user functionality coming soon!');
        }

        function editUser(email) {
            // TODO: Implement edit user modal/page
            alert('Edit user functionality coming soon! Email: ' + email);
        }

        function deleteUser(email) {
            if (confirm('Are you sure you want to delete this user?')) {
                // TODO: Implement delete functionality
                alert('Delete functionality coming soon! Email: ' + email);
            }
        }
    </script>
</body>
</html>
