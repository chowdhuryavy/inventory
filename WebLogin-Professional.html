<!DOCTYPE html>
<html lang="en">
<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #3b82f6;
            --secondary-color: #64748b;
            --success-color: #059669;
            --error-color: #dc2626;
            --warning-color: #d97706;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --white: #ffffff;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            --border-radius: 0.5rem;
            --border-radius-lg: 0.75rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            line-height: 1.6;
            color: var(--gray-700);
        }
        
        .login-wrapper {
            width: 100%;
            max-width: 28rem;
            position: relative;
        }
        
        .login-container {
            background: var(--white);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            position: relative;
            animation: fadeIn 0.6s ease-out;
        }
        
        .login-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            padding: 2rem 2rem 2.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .login-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: float 6s ease-in-out infinite;
        }
        
        .login-header .logo {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
            position: relative;
            z-index: 1;
        }
        
        .login-header h1 {
            color: var(--white);
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
        }
        
        .login-header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.875rem;
            font-weight: 400;
            position: relative;
            z-index: 1;
        }
        
        .login-body {
            padding: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--gray-700);
            font-weight: 500;
            font-size: 0.875rem;
        }
        
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--gray-200);
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease;
            background-color: var(--gray-50);
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: var(--white);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            transform: translateY(-1px);
        }
        
        .form-input:valid {
            border-color: var(--success-color);
        }
        
        .input-icon {
            position: absolute;
            left: 1rem;
            top: 2.25rem;
            color: var(--gray-400);
            pointer-events: none;
        }
        
        .form-input.with-icon {
            padding-left: 2.75rem;
        }
        
        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 2.25rem;
            cursor: pointer;
            color: var(--gray-400);
            transition: color 0.2s ease;
            user-select: none;
        }
        
        .password-toggle:hover {
            color: var(--gray-600);
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .checkbox {
            width: 1rem;
            height: 1rem;
            border: 2px solid var(--gray-300);
            border-radius: 0.25rem;
            cursor: pointer;
        }
        
        .checkbox:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .login-btn {
            width: 100%;
            padding: 0.875rem 1.5rem;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: var(--white);
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .login-btn:hover::before {
            left: 100%;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .login-btn:disabled:hover {
            transform: none;
            box-shadow: none;
        }
        
        .btn-text {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            margin-top: 1rem;
            color: var(--primary-color);
            font-size: 0.875rem;
            gap: 0.5rem;
        }
        
        .loading.show {
            display: flex;
        }
        
        .spinner {
            width: 1rem;
            height: 1rem;
            border: 2px solid var(--gray-200);
            border-top: 2px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .alert {
            padding: 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
        }
        
        .alert.show {
            display: flex;
        }
        
        .alert-error {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: var(--error-color);
        }
        
        .alert-success {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: var(--success-color);
        }
        
        .footer {
            text-align: center;
            padding: 1.5rem 2rem 2rem;
            border-top: 1px solid var(--gray-100);
            background-color: var(--gray-50);
        }
        
        .footer p {
            color: var(--gray-500);
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
        }
        
        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            background-color: var(--success-color);
            color: var(--white);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        
        .demo-credentials {
            background-color: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: var(--border-radius);
            padding: 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }
        
        .demo-credentials h4 {
            color: var(--gray-700);
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .demo-credentials p {
            color: var(--gray-600);
            margin: 0.25rem 0;
        }
        
        .demo-credentials code {
            background-color: var(--gray-100);
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
        }
        
        @media (max-width: 480px) {
            .login-wrapper {
                margin: 0.5rem;
            }
            
            .login-header {
                padding: 1.5rem 1rem 2rem;
            }
            
            .login-header h1 {
                font-size: 1.5rem;
            }
            
            .login-body {
                padding: 1.5rem;
            }
            
            .footer {
                padding: 1rem;
            }
            
            .remember-forgot {
                flex-direction: column;
                gap: 0.75rem;
                align-items: flex-start;
            }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }
        
        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(30px) scale(0.95); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container fade-in">
            <div class="login-header">
                <div class="logo"><?= logo ?></div>
                <h1><?= companyName ?></h1>
                <p><?= slogan ?></p>
            </div>
            
            <div class="login-body">
                <div class="demo-credentials">
                    <h4><i class="fas fa-info-circle"></i> Demo Credentials</h4>
                    <p><strong>Email:</strong> <code>your-google-email@gmail.com</code></p>
                    <p><strong>Password:</strong> <code>admin123</code></p>
                    <p><small>Password is stored in Users sheet, column C</small></p>
                </div>
                
                <div class="alert alert-error" id="errorMessage">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span id="errorText"></span>
                </div>
                
                <div class="alert alert-success" id="successMessage">
                    <i class="fas fa-check-circle"></i>
                    <span id="successText"></span>
                </div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope"></i> Email Address
                        </label>
                        <div class="input-icon">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input with-icon" 
                            placeholder="Enter your email address"
                            required 
                            autocomplete="email"
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock"></i> Password
                        </label>
                        <div class="input-icon">
                            <i class="fas fa-lock"></i>
                        </div>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input with-icon" 
                            placeholder="Enter your password"
                            required 
                            autocomplete="current-password"
                        >
                        <div class="password-toggle" onclick="togglePassword()">
                            <i class="fas fa-eye" id="passwordToggleIcon"></i>
                        </div>
                    </div>
                    
                    <div class="remember-forgot">
                        <div class="remember-me">
                            <input type="checkbox" id="rememberMe" class="checkbox">
                            <label for="rememberMe">Remember me</label>
                        </div>
                    </div>
                    
                    <button type="submit" class="login-btn" id="loginBtn">
                        <span class="btn-text">
                            <i class="fas fa-sign-in-alt"></i>
                            Sign In
                        </span>
                    </button>
                    
                    <div class="loading" id="loadingDiv">
                        <div class="spinner"></div>
                        <span>Authenticating...</span>
                    </div>
                </form>
            </div>
            
            <div class="footer">
                <p>&copy; 2024 <?= companyName ?></p>
                <div class="security-badge">
                    <i class="fas fa-shield-alt"></i>
                    Secure Login
                </div>
            </div>
        </div>
    </div>

    <script>
        let appUrl = '<?= appUrl ?>';

        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const rememberMeCheckbox = document.getElementById('rememberMe');
            
            // Load remembered credentials
            loadRememberedCredentials();
            
            // Form submission
            loginForm.addEventListener('submit', handleLogin);
            
            // Enter key support
            emailInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    passwordInput.focus();
                }
            });
            
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    handleLogin(e);
                }
            });
            
            // Log page load
            logClientActivity('page_load', 'Login page loaded');
            
            // Focus on email field
            emailInput.focus();
        });

        async function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            hideMessages();
            
            if (!email || !password) {
                showError('Please enter both email and password');
                return;
            }
            
            setLoading(true);
            logClientActivity('login_attempt', `Login attempt for ${email}`);
            
            try {
                const formData = new FormData();
                formData.append('action', 'login');
                formData.append('email', email);
                formData.append('password', password);
                
                const response = await fetch(appUrl, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showSuccess('Login successful! Redirecting...');
                    
                    if (rememberMe) {
                        saveCredentials(email);
                    } else {
                        clearSavedCredentials();
                    }
                    
                    logClientActivity('login_success', `Successful login for ${email}`);
                    
                    setTimeout(() => {
                        window.location.href = result.redirectUrl;
                    }, 1000);
                } else {
                    const errorMsg = result.message || 'Login failed';
                    showError(errorMsg);
                    logClientActivity('login_failed', `Failed login: ${errorMsg}`);
                    
                    // Show debug info in console for troubleshooting
                    if (result.debugInfo) {
                        console.log('Login Debug Info:', result.debugInfo);
                    }
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Network error. Please check your connection and try again.');
                logClientActivity('login_error', `Network error: ${error.message}`);
            } finally {
                setLoading(false);
            }
        }

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('passwordToggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                toggleIcon.className = 'fas fa-eye';
            }
            
            logClientActivity('password_toggle', 'Password visibility toggled');
        }

        function setLoading(loading) {
            const loginBtn = document.getElementById('loginBtn');
            const loadingDiv = document.getElementById('loadingDiv');
            
            if (loading) {
                loginBtn.disabled = true;
                loadingDiv.classList.add('show');
            } else {
                loginBtn.disabled = false;
                loadingDiv.classList.remove('show');
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorDiv.classList.add('show');
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            const successText = document.getElementById('successText');
            successText.textContent = message;
            successDiv.classList.add('show');
        }

        function hideMessages() {
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');
        }

        function saveCredentials(email) {
            try {
                localStorage.setItem('rememberedEmail', email);
                localStorage.setItem('rememberMe', 'true');
            } catch (e) {
                console.log('Unable to save credentials to localStorage');
            }
        }

        function loadRememberedCredentials() {
            try {
                const rememberedEmail = localStorage.getItem('rememberedEmail');
                const rememberMe = localStorage.getItem('rememberMe') === 'true';
                
                if (rememberMe && rememberedEmail) {
                    document.getElementById('email').value = rememberedEmail;
                    document.getElementById('rememberMe').checked = true;
                }
            } catch (e) {
                console.log('Unable to load credentials from localStorage');
            }
        }

        function clearSavedCredentials() {
            try {
                localStorage.removeItem('rememberedEmail');
                localStorage.removeItem('rememberMe');
            } catch (e) {
                console.log('Unable to clear credentials from localStorage');
            }
        }

        function logClientActivity(action, description) {
            try {
                // Send to server for logging
                const formData = new FormData();
                formData.append('action', 'log_activity');
                formData.append('activity_action', action);
                formData.append('description', description);
                formData.append('timestamp', new Date().toISOString());
                
                fetch(appUrl, {
                    method: 'POST',
                    body: formData
                }).catch(error => {
                    console.log('Failed to log activity:', error);
                });
            } catch (error) {
                console.log('Error logging activity:', error);
            }
        }

        // Enhanced activity logging
        document.addEventListener('click', function(e) {
            const target = e.target;
            const action = target.id || target.className || target.tagName;
            logClientActivity('click', `Clicked: ${action}`);
        });

        document.addEventListener('keydown', function(e) {
            if (e.target.type === 'password' || e.target.type === 'email') {
                logClientActivity('input', `Typing in ${e.target.type} field`);
            }
        });

        window.addEventListener('beforeunload', function() {
            logClientActivity('page_unload', 'User leaving login page');
        });

        window.addEventListener('focus', function() {
            logClientActivity('window_focus', 'Window gained focus');
        });

        window.addEventListener('blur', function() {
            logClientActivity('window_blur', 'Window lost focus');
        });
    </script>
</body>
</html>
