<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title><?= typeof companyName !== 'undefined' ? companyName : 'Inventory System' ?> - Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .loading-container {
            text-align: center;
            max-width: 400px;
            padding: 40px 20px;
            position: relative;
        }

        .company-logo {
            font-size: 6rem;
            margin-bottom: 2rem;
            animation: logoFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }

        .company-name {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.5s forwards;
        }

        .company-slogan {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 3rem;
            font-style: italic;
            opacity: 0;
            animation: fadeInUp 1s ease-out 1s forwards;
        }

        .loading-progress {
            position: relative;
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeInUp 1s ease-out 1.5s forwards;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #22d3ee, #a78bfa);
            background-size: 200% 100%;
            border-radius: 10px;
            animation: progressFill 3s ease-in-out infinite, shimmer 2s linear infinite;
            width: 0%;
        }

        .loading-text {
            margin-top: 1rem;
            font-size: 1rem;
            opacity: 0.8;
            animation: textPulse 2s ease-in-out infinite;
        }

        .loading-dots {
            display: inline-block;
            position: relative;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            animation: particleFloat 8s linear infinite;
        }

        .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 1s; }
        .particle:nth-child(3) { left: 30%; animation-delay: 2s; }
        .particle:nth-child(4) { left: 40%; animation-delay: 3s; }
        .particle:nth-child(5) { left: 50%; animation-delay: 4s; }
        .particle:nth-child(6) { left: 60%; animation-delay: 5s; }
        .particle:nth-child(7) { left: 70%; animation-delay: 6s; }
        .particle:nth-child(8) { left: 80%; animation-delay: 7s; }
        .particle:nth-child(9) { left: 90%; animation-delay: 8s; }

        /* Add more particle variations */
        .particle:nth-child(10) { left: 15%; animation-delay: 2.5s; width: 6px; height: 6px; }
        .particle:nth-child(11) { left: 35%; animation-delay: 4.5s; width: 3px; height: 3px; }
        .particle:nth-child(12) { left: 65%; animation-delay: 6.5s; width: 5px; height: 5px; }
        .particle:nth-child(13) { left: 85%; animation-delay: 1.5s; width: 3px; height: 3px; }
        .particle:nth-child(14) { left: 25%; animation-delay: 7.5s; width: 4px; height: 4px; }
        .particle:nth-child(15) { left: 75%; animation-delay: 3.5s; width: 6px; height: 6px; }

        @keyframes logoFloat {
            0%, 100% { 
                transform: translateY(0px) scale(1);
            }
            50% { 
                transform: translateY(-20px) scale(1.05);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes progressFill {
            0% { width: 0%; }
            25% { width: 30%; }
            50% { width: 60%; }
            75% { width: 85%; }
            100% { width: 100%; }
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @keyframes textPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .loading-status {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            opacity: 0.7;
            animation: statusFade 4s ease-in-out infinite;
        }

        @keyframes statusFade {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* Mobile Responsiveness */
        @media (max-width: 480px) {
            .company-logo {
                font-size: 4rem;
                margin-bottom: 1.5rem;
            }

            .company-name {
                font-size: 2rem;
            }

            .company-slogan {
                font-size: 1rem;
                margin-bottom: 2rem;
            }

            .loading-container {
                padding: 30px 15px;
            }
        }

        /* Reduced motion for accessibility */
        @media (prefers-reduced-motion: reduce) {
            .company-logo,
            .loading-text,
            .particle {
                animation: none;
            }
            
            .progress-fill {
                animation: progressFill 3s ease-in-out infinite;
            }
        }
    </style>
</head>
<body>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="loading-container">
        <div class="company-logo"><?= typeof logo !== 'undefined' ? logo : '📦' ?></div>
        
        <h1 class="company-name"><?= typeof companyName !== 'undefined' ? companyName : 'Inventory System' ?></h1>
        
        <p class="company-slogan"><?= typeof slogan !== 'undefined' ? slogan : 'Professional Inventory Management' ?></p>
        
        <div class="loading-progress">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <div class="loading-text">
                Loading your workspace<span class="loading-dots"></span>
            </div>
        </div>
        
        <div class="loading-status" id="loadingStatus">
            Initializing system...
        </div>
    </div>

    <script>
        const appUrl = '<?= appUrl ?>';
        const targetUrl = '<?= targetUrl || (appUrl + "?page=dashboard") ?>';
        
        // Loading status messages
        const statusMessages = [
            'Initializing system...',
            'Loading user data...',
            'Preparing dashboard...',
            'Setting up interface...',
            'Almost ready...'
        ];
        
        let currentStatus = 0;
        const statusElement = document.getElementById('loadingStatus');
        
        // Update status messages
        const statusInterval = setInterval(() => {
            if (currentStatus < statusMessages.length - 1) {
                currentStatus++;
                statusElement.textContent = statusMessages[currentStatus];
            }
        }, 800);
        
        // Redirect after loading animation
        setTimeout(() => {
            clearInterval(statusInterval);
            statusElement.textContent = 'Redirecting...';
            
            // Fade out effect
            document.body.style.transition = 'opacity 0.5s ease-out';
            document.body.style.opacity = '0';
            
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 500);
        }, 4000);
        
        // Handle errors gracefully
        window.addEventListener('error', function(e) {
            console.error('Loading page error:', e.error);
            // Still redirect even if there are errors
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 1000);
        });
        
        // Prevent back button during loading
        history.pushState(null, null, location.href);
        window.addEventListener('popstate', function() {
            history.pushState(null, null, location.href);
        });
    </script>
</body>
</html>
