<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
        }

        .status-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 500px;
            margin: 0 auto;
        }

        .status-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .status-icon {
            font-size: 4em;
            margin-bottom: 15px;
        }

        .status-title {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status-message {
            color: #718096;
            font-size: 1.1em;
        }

        .user-info {
            background: #f7fafc;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #4a5568;
        }

        .info-value {
            color: #2d3748;
        }

        .role-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .role-super-admin {
            background: #e53e3e;
            color: white;
        }

        .role-admin {
            background: #667eea;
            color: white;
        }

        .role-cashier {
            background: #48bb78;
            color: white;
        }

        .status-active {
            color: #22543d;
            background: #c6f6d5;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.9em;
            font-weight: 500;
        }

        .status-inactive {
            color: #e53e3e;
            background: #fed7d7;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.9em;
            font-weight: 500;
        }

        .permissions-section {
            margin-top: 20px;
        }

        .permissions-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 15px;
            text-align: center;
        }

        .permissions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .permission-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #f7fafc;
            border-radius: 8px;
            font-size: 0.9em;
        }

        .permission-allowed {
            color: #22543d;
        }

        .permission-denied {
            color: #e53e3e;
        }

        .error-container {
            text-align: center;
        }

        .error-icon {
            font-size: 4em;
            color: #e53e3e;
            margin-bottom: 15px;
        }

        .error-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #e53e3e;
            margin-bottom: 10px;
        }

        .error-message {
            color: #718096;
            margin-bottom: 20px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-secondary {
            background: #718096;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .last-login {
            background: #edf2f7;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
        }

        .last-login-time {
            font-weight: bold;
            color: #4a5568;
        }
    </style>
</head>
<body>
    <div class="status-container">
        <? if (authResult.authenticated) { ?>
            <!-- Authenticated User -->
            <div class="status-header">
                <div class="status-icon">✅</div>
                <div class="status-title">Access Granted</div>
                <div class="status-message">You are successfully logged into the system</div>
            </div>

            <div class="user-info">
                <div class="info-row">
                    <span class="info-label">Email:</span>
                    <span class="info-value"><?= authResult.user.email ?></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Name:</span>
                    <span class="info-value"><?= authResult.user.name ?></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Role:</span>
                    <span class="role-badge role-<?= authResult.user.role.replace(' ', '-').toLowerCase() ?>">
                        <?= authResult.user.role ?>
                    </span>
                </div>
                <div class="info-row">
                    <span class="info-label">Status:</span>
                    <span class="status-<?= authResult.user.status.toLowerCase() ?>">
                        <?= authResult.user.status ?>
                    </span>
                </div>
                <div class="info-row">
                    <span class="info-label">Member Since:</span>
                    <span class="info-value">
                        <?= new Date(authResult.user.dateAdded).toLocaleDateString() ?>
                    </span>
                </div>
            </div>

            <div class="permissions-section">
                <div class="permissions-title">Your Permissions</div>
                <div class="permissions-grid">
                    <? Object.entries(authResult.permissions).forEach(([key, value]) => { ?>
                        <div class="permission-item">
                            <span class="permission-<?= value ? 'allowed' : 'denied' ?>">
                                <?= value ? '✅' : '❌' ?>
                            </span>
                            <span><?= key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase()) ?></span>
                        </div>
                    <? }); ?>
                </div>
            </div>

            <div class="last-login">
                <div>Current Login Session</div>
                <div class="last-login-time"><?= new Date().toLocaleString() ?></div>
            </div>

        <? } else { ?>
            <!-- Access Denied -->
            <div class="error-container">
                <div class="error-icon">🚫</div>
                <div class="error-title">Access Denied</div>
                <div class="error-message"><?= authResult.message ?></div>
                
                <div class="user-info">
                    <div class="info-row">
                        <span class="info-label">Your Email:</span>
                        <span class="info-value"><?= authResult.userEmail ?></span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Access Level:</span>
                        <span class="status-inactive">Unauthorized</span>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="requestAccess()">
                        📧 Request Access
                    </button>
                    <button class="btn btn-secondary" onclick="google.script.host.close()">
                        ✖️ Close
                    </button>
                </div>
            </div>
        <? } ?>
    </div>

    <script>
        function requestAccess() {
            google.script.run
                .withSuccessHandler(function() {
                    alert('Access request sent successfully!');
                    google.script.host.close();
                })
                .withFailureHandler(function(error) {
                    alert('Error sending request: ' + error);
                })
                .requestAccess();
        }

        // Auto-close for authenticated users after 10 seconds
        <? if (authResult.authenticated) { ?>
            setTimeout(function() {
                const shouldClose = confirm('Close login status window?');
                if (shouldClose) {
                    google.script.host.close();
                }
            }, 10000);
        <? } ?>
    </script>
</body>
</html>
