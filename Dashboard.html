<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }

        .dashboard-container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            color: #4a5568;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .header .user-info {
            color: #718096;
            font-size: 1.1em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #718096;
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .alerts-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .alert-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .alert-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .alert-icon {
            font-size: 1.5em;
            margin-right: 10px;
        }

        .alert-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #4a5568;
        }

        .alert-count {
            background: #e53e3e;
            color: white;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
            margin-left: auto;
        }

        .alert-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .alert-item {
            padding: 10px;
            background: #f7fafc;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid #e53e3e;
        }

        .alert-item.warning {
            border-left-color: #f6ad55;
        }

        .alert-item.low-stock {
            border-left-color: #fc8181;
        }

        .activity-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .activity-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            height: 400px;
        }

        .activity-header {
            font-size: 1.3em;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
        }

        .activity-list {
            height: 320px;
            overflow-y: auto;
        }

        .activity-item {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            transition: background 0.3s ease;
        }

        .activity-item:hover {
            background: #f7fafc;
        }

        .activity-time {
            font-size: 0.85em;
            color: #718096;
            margin-bottom: 5px;
        }

        .activity-description {
            color: #4a5568;
            font-weight: 500;
        }

        .activity-user {
            font-size: 0.9em;
            color: #667eea;
            margin-top: 5px;
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 1.5em;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .refresh-btn:hover {
            transform: scale(1.1);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #718096;
        }

        .spinner {
            border: 4px solid #e2e8f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-data {
            text-align: center;
            color: #718096;
            font-style: italic;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .dashboard-container {
                padding: 10px;
            }
            
            .activity-section {
                grid-template-columns: 1fr;
            }
            
            .activity-card {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h1>📊 Inventory Dashboard</h1>
            <div class="user-info">
                Welcome, <strong><?= getCurrentUserRole() ?></strong> | 
                Last updated: <span id="lastUpdate"></span>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalItems">-</div>
                <div class="stat-label">Total Items</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalValue">-</div>
                <div class="stat-label">Total Value</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="lowStockCount">-</div>
                <div class="stat-label">Low Stock Items</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="expiredCount">-</div>
                <div class="stat-label">Expired Items</div>
            </div>
        </div>

        <div class="alerts-section">
            <div class="alert-card">
                <div class="alert-header">
                    <span class="alert-icon">⚠️</span>
                    <span class="alert-title">Low Stock Alerts</span>
                    <span class="alert-count" id="lowStockBadge">0</span>
                </div>
                <div class="alert-list" id="lowStockList">
                    <div class="loading">
                        <div class="spinner"></div>
                        Loading low stock items...
                    </div>
                </div>
            </div>

            <div class="alert-card">
                <div class="alert-header">
                    <span class="alert-icon">🚨</span>
                    <span class="alert-title">Expiry Alerts</span>
                    <span class="alert-count" id="expiryBadge">0</span>
                </div>
                <div class="alert-list" id="expiryList">
                    <div class="loading">
                        <div class="spinner"></div>
                        Loading expiry alerts...
                    </div>
                </div>
            </div>
        </div>

        <div class="activity-section">
            <div class="activity-card">
                <div class="activity-header">📝 Recent Activities</div>
                <div class="activity-list" id="activityList">
                    <div class="loading">
                        <div class="spinner"></div>
                        Loading recent activities...
                    </div>
                </div>
            </div>

            <div class="activity-card">
                <div class="activity-header">📦 Recent Stock Changes</div>
                <div class="activity-list" id="stockChangesList">
                    <div class="loading">
                        <div class="spinner"></div>
                        Loading stock changes...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button class="refresh-btn" onclick="refreshDashboard()" title="Refresh Dashboard">
        🔄
    </button>

    <script>
        let dashboardData = null;

        // Initialize dashboard on load
        document.addEventListener('DOMContentLoaded', function() {
            loadDashboardData();
            updateLastUpdateTime();
        });

        function loadDashboardData() {
            try {
                google.script.run
                    .withSuccessHandler(displayDashboardData)
                    .withFailureHandler(handleError)
                    .getDashboardData();
            } catch (error) {
                console.error('Error loading dashboard data:', error);
                handleError(error);
            }
        }

        function displayDashboardData(data) {
            dashboardData = data;
            
            // Update statistics
            document.getElementById('totalItems').textContent = data.stats.totalItems || 0;
            document.getElementById('totalValue').textContent = '$' + (data.stats.totalValue || 0).toFixed(2);
            document.getElementById('lowStockCount').textContent = data.alerts.lowStock.length || 0;
            document.getElementById('expiredCount').textContent = data.alerts.expired.length || 0;

            // Update alert badges
            document.getElementById('lowStockBadge').textContent = data.alerts.lowStock.length || 0;
            document.getElementById('expiryBadge').textContent = 
                (data.alerts.expired.length + data.alerts.expiringSoon.length) || 0;

            // Display alerts
            displayLowStockAlerts(data.alerts.lowStock);
            displayExpiryAlerts(data.alerts.expired, data.alerts.expiringSoon);

            // Display activities
            displayRecentActivities(data.recentActivities);
            displayStockChanges(data.recentStockChanges);

            updateLastUpdateTime();
        }

        function displayLowStockAlerts(lowStockItems) {
            const container = document.getElementById('lowStockList');
            
            if (!lowStockItems || lowStockItems.length === 0) {
                container.innerHTML = '<div class="no-data">✅ No low stock items</div>';
                return;
            }

            const html = lowStockItems.slice(0, 5).map(item => `
                <div class="alert-item low-stock">
                    <strong>${item.productName}</strong> (${item.sku})<br>
                    <small>Current: ${item.quantity} | Min: ${item.minStockLevel}</small>
                </div>
            `).join('');

            container.innerHTML = html;
        }

        function displayExpiryAlerts(expiredItems, expiringSoonItems) {
            const container = document.getElementById('expiryList');
            const allItems = [];

            if (expiredItems && expiredItems.length > 0) {
                expiredItems.forEach(item => {
                    allItems.push({
                        ...item,
                        status: 'expired',
                        displayText: `Expired ${new Date(item.expiryDate).toLocaleDateString()}`
                    });
                });
            }

            if (expiringSoonItems && expiringSoonItems.length > 0) {
                expiringSoonItems.forEach(item => {
                    allItems.push({
                        ...item,
                        status: 'expiring',
                        displayText: `Expires in ${item.daysUntilExpiry} days`
                    });
                });
            }

            if (allItems.length === 0) {
                container.innerHTML = '<div class="no-data">✅ No expiry alerts</div>';
                return;
            }

            const html = allItems.slice(0, 6).map(item => `
                <div class="alert-item ${item.status === 'expired' ? '' : 'warning'}">
                    <strong>${item.productName}</strong> (${item.sku})<br>
                    <small>${item.displayText}</small>
                </div>
            `).join('');

            container.innerHTML = html;
        }

        function displayRecentActivities(activities) {
            const container = document.getElementById('activityList');
            
            if (!activities || activities.length === 0) {
                container.innerHTML = '<div class="no-data">No recent activities</div>';
                return;
            }

            const html = activities.map(activity => `
                <div class="activity-item">
                    <div class="activity-time">${new Date(activity.timestamp).toLocaleString()}</div>
                    <div class="activity-description">${activity.action}</div>
                    <div class="activity-user">by ${activity.userEmail}</div>
                </div>
            `).join('');

            container.innerHTML = html;
        }

        function displayStockChanges(stockChanges) {
            const container = document.getElementById('stockChangesList');
            
            if (!stockChanges || stockChanges.length === 0) {
                container.innerHTML = '<div class="no-data">No recent stock changes</div>';
                return;
            }

            const html = stockChanges.map(change => `
                <div class="activity-item">
                    <div class="activity-time">${new Date(change.timestamp).toLocaleString()}</div>
                    <div class="activity-description">
                        <strong>${change.action}</strong>: ${change.productName} (${change.sku})
                        <br><small>Quantity: ${change.quantity}</small>
                    </div>
                    <div class="activity-user">by ${change.updatedBy}</div>
                </div>
            `).join('');

            container.innerHTML = html;
        }

        function refreshDashboard() {
            // Add loading state
            const refreshBtn = document.querySelector('.refresh-btn');
            const originalContent = refreshBtn.innerHTML;
            refreshBtn.innerHTML = '⏳';
            refreshBtn.disabled = true;

            // Reload data
            loadDashboardData();

            // Reset button after 2 seconds
            setTimeout(() => {
                refreshBtn.innerHTML = originalContent;
                refreshBtn.disabled = false;
            }, 2000);
        }

        function updateLastUpdateTime() {
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString();
        }

        function handleError(error) {
            console.error('Dashboard error:', error);
            
            // Show error in UI
            const containers = ['lowStockList', 'expiryList', 'activityList', 'stockChangesList'];
            containers.forEach(id => {
                const container = document.getElementById(id);
                if (container) {
                    container.innerHTML = `<div class="no-data">❌ Error loading data: ${error.message || error}</div>`;
                }
            });
        }

        // Auto-refresh every 5 minutes
        setInterval(loadDashboardData, 5 * 60 * 1000);
    </script>
</body>
</html>
