<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }

        .container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #4a5568;
            font-size: 2em;
        }

        .toolbar {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-warning {
            background: #ed8936;
            color: white;
        }

        .btn-danger {
            background: #e53e3e;
            color: white;
        }

        .btn-secondary {
            background: #718096;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .users-table {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .table-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f7fafc;
            font-weight: 600;
            color: #4a5568;
        }

        tr:hover {
            background: #f7fafc;
        }

        .role-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .role-super-admin {
            background: #e53e3e;
            color: white;
        }

        .role-admin {
            background: #667eea;
            color: white;
        }

        .role-cashier {
            background: #48bb78;
            color: white;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .status-active {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-inactive {
            background: #fed7d7;
            color: #e53e3e;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
        }

        .modal-content {
            background: white;
            margin: 50px auto;
            padding: 0;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            color: white;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            background: none;
        }

        .close:hover {
            opacity: 0.7;
        }

        .modal-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #4a5568;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #718096;
        }

        .spinner {
            border: 4px solid #e2e8f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }

        .alert-error {
            background: #fed7d7;
            color: #e53e3e;
            border: 1px solid #feb2b2;
        }

        .user-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #718096;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👥 User Management</h1>
            <div>Role: <strong><?= getCurrentUserRole() ?></strong></div>
        </div>

        <div id="alertContainer"></div>

        <div class="user-stats" id="userStats">
            <div class="stat-card">
                <div class="stat-number" id="totalUsers">-</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeUsers">-</div>
                <div class="stat-label">Active Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="adminCount">-</div>
                <div class="stat-label">Admins</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="cashierCount">-</div>
                <div class="stat-label">Cashiers</div>
            </div>
        </div>

        <div class="toolbar">
            <button class="btn btn-primary" onclick="openAddUserModal()">
                ➕ Add User
            </button>
            <button class="btn btn-secondary" onclick="refreshUsers()">
                🔄 Refresh
            </button>
        </div>

        <div class="users-table">
            <div class="table-header">System Users</div>
            <table>
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Date Added</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr>
                        <td colspan="6">
                            <div class="loading">
                                <div class="spinner"></div>
                                Loading users...
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit User Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="userModalTitle">Add New User</h2>
                <button class="close" onclick="closeUserModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="userForm">
                    <div class="form-group">
                        <label for="userEmail">Email *</label>
                        <input type="email" id="userEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="userName">Name *</label>
                        <input type="text" id="userName" required>
                    </div>
                    <div class="form-group">
                        <label for="userRole">Role *</label>
                        <select id="userRole" required>
                            <option value="">Select role...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="userStatus">Status *</label>
                        <select id="userStatus" required>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                    <div class="action-buttons">
                        <button type="submit" class="btn btn-primary">Save User</button>
                        <button type="button" class="btn btn-secondary" onclick="closeUserModal()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let usersData = [];
        let currentEditEmail = null;
        const currentUserRole = '<?= userRole ?>';

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            loadUsers();
            loadUserStats();
            setupEventListeners();
            populateRoleOptions();
        });

        function setupEventListeners() {
            document.getElementById('userForm').addEventListener('submit', handleUserSubmit);
        }

        function loadUsers() {
            google.script.run
                .withSuccessHandler(displayUsers)
                .withFailureHandler(handleError)
                .getUsers();
        }

        function loadUserStats() {
            google.script.run
                .withSuccessHandler(displayUserStats)
                .withFailureHandler(handleError)
                .getUserStats();
        }

        function displayUsers(users) {
            usersData = users;
            const tbody = document.getElementById('usersTableBody');
            
            if (!users || users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #718096;">No users found</td></tr>';
                return;
            }

            const html = users.map(user => `
                <tr>
                    <td>${user.email}</td>
                    <td>${user.name}</td>
                    <td>${getRoleBadge(user.role)}</td>
                    <td>${getStatusBadge(user.status)}</td>
                    <td>${new Date(user.dateAdded).toLocaleDateString()}</td>
                    <td>${getActionButtons(user)}</td>
                </tr>
            `).join('');

            tbody.innerHTML = html;
        }

        function displayUserStats(stats) {
            document.getElementById('totalUsers').textContent = stats.totalUsers || 0;
            document.getElementById('activeUsers').textContent = stats.activeUsers || 0;
            document.getElementById('adminCount').textContent = stats.roleDistribution.Admin || 0;
            document.getElementById('cashierCount').textContent = stats.roleDistribution.Cashier || 0;
        }

        function getRoleBadge(role) {
            const roleClass = role.replace(' ', '-').toLowerCase();
            return `<span class="role-badge role-${roleClass}">${role}</span>`;
        }

        function getStatusBadge(status) {
            const statusClass = status.toLowerCase();
            return `<span class="status-badge status-${statusClass}">${status}</span>`;
        }

        function getActionButtons(user) {
            const currentUserEmail = '<?= Session.getActiveUser().getEmail() ?>';
            
            let buttons = '<div style="display: flex; gap: 5px;">';
            
            // Edit button
            if (user.role !== 'Super Admin' || currentUserRole === 'Super Admin') {
                buttons += `<button class="btn btn-warning" style="padding: 6px 12px; font-size: 0.8em;" onclick="editUser('${user.email}')">Edit</button>`;
            }
            
            // Activate/Deactivate button (prevent self-deactivation)
            if (user.email !== currentUserEmail) {
                if (user.status === 'Active') {
                    if (user.role !== 'Super Admin' || currentUserRole === 'Super Admin') {
                        buttons += `<button class="btn btn-danger" style="padding: 6px 12px; font-size: 0.8em;" onclick="deactivateUser('${user.email}')">Deactivate</button>`;
                    }
                } else {
                    if (user.role !== 'Super Admin' || currentUserRole === 'Super Admin') {
                        buttons += `<button class="btn btn-success" style="padding: 6px 12px; font-size: 0.8em;" onclick="reactivateUser('${user.email}')">Activate</button>`;
                    }
                }
            }
            
            buttons += '</div>';
            return buttons;
        }

        function populateRoleOptions() {
            google.script.run
                .withSuccessHandler(function(roles) {
                    const select = document.getElementById('userRole');
                    select.innerHTML = '<option value="">Select role...</option>';
                    
                    roles.forEach(role => {
                        const option = document.createElement('option');
                        option.value = role;
                        option.textContent = role;
                        select.appendChild(option);
                    });
                })
                .withFailureHandler(handleError)
                .getAvailableRoles();
        }

        function openAddUserModal() {
            currentEditEmail = null;
            document.getElementById('userModalTitle').textContent = 'Add New User';
            document.getElementById('userForm').reset();
            document.getElementById('userEmail').readOnly = false;
            document.getElementById('userModal').style.display = 'block';
        }

        function editUser(email) {
            const user = usersData.find(u => u.email === email);
            if (!user) return;

            currentEditEmail = email;
            document.getElementById('userModalTitle').textContent = 'Edit User';
            
            document.getElementById('userEmail').value = user.email;
            document.getElementById('userName').value = user.name;
            document.getElementById('userRole').value = user.role;
            document.getElementById('userStatus').value = user.status;
            
            document.getElementById('userEmail').readOnly = true;
            document.getElementById('userModal').style.display = 'block';
        }

        function deactivateUser(email) {
            if (!confirm('Are you sure you want to deactivate this user?')) {
                return;
            }

            google.script.run
                .withSuccessHandler(function(result) {
                    if (result.success) {
                        showAlert('User deactivated successfully', 'success');
                        loadUsers();
                        loadUserStats();
                    } else {
                        showAlert('Error: ' + result.message, 'error');
                    }
                })
                .withFailureHandler(handleError)
                .deleteUser(email);
        }

        function reactivateUser(email) {
            google.script.run
                .withSuccessHandler(function(result) {
                    if (result.success) {
                        showAlert('User reactivated successfully', 'success');
                        loadUsers();
                        loadUserStats();
                    } else {
                        showAlert('Error: ' + result.message, 'error');
                    }
                })
                .withFailureHandler(handleError)
                .reactivateUser(email);
        }

        function closeUserModal() {
            document.getElementById('userModal').style.display = 'none';
            currentEditEmail = null;
        }

        function handleUserSubmit(e) {
            e.preventDefault();
            
            const userData = {
                email: document.getElementById('userEmail').value,
                name: document.getElementById('userName').value,
                role: document.getElementById('userRole').value,
                status: document.getElementById('userStatus').value
            };

            if (currentEditEmail) {
                // Update existing user
                google.script.run
                    .withSuccessHandler(function(result) {
                        if (result.success) {
                            showAlert('User updated successfully', 'success');
                            closeUserModal();
                            loadUsers();
                            loadUserStats();
                        } else {
                            showAlert('Error: ' + result.message, 'error');
                        }
                    })
                    .withFailureHandler(handleError)
                    .updateUser(currentEditEmail, userData);
            } else {
                // Add new user
                google.script.run
                    .withSuccessHandler(function(result) {
                        if (result.success) {
                            showAlert('User added successfully', 'success');
                            closeUserModal();
                            loadUsers();
                            loadUserStats();
                        } else {
                            showAlert('Error: ' + result.message, 'error');
                        }
                    })
                    .withFailureHandler(handleError)
                    .addUser(userData);
            }
        }

        function refreshUsers() {
            showAlert('Refreshing users...', 'success');
            loadUsers();
            loadUserStats();
        }

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alert.style.display = 'block';
            
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alert);
            
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        function handleError(error) {
            console.error('Error:', error);
            showAlert('Error: ' + (error.message || error), 'error');
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('userModal');
            if (event.target === modal) {
                closeUserModal();
            }
        };
    </script>
</body>
</html>
