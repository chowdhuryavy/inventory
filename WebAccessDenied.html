<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Access Denied - Inventory System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .error-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            margin: 20px;
        }

        .error-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: shake 2s infinite;
        }

        @keyframes shake {
            0%, 20%, 50%, 80%, 100% { transform: translateX(0); }
            10% { transform: translateX(-10px); }
            30% { transform: translateX(10px); }
            60% { transform: translateX(-5px); }
            90% { transform: translateX(5px); }
        }

        h1 {
            color: #e53e3e;
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .error-message {
            color: #718096;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .error-code {
            background: #fed7d7;
            color: #c53030;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            margin-bottom: 30px;
            display: inline-block;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            min-width: 120px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #4299e1;
            color: white;
        }

        .btn-primary:hover {
            background: #3182ce;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
            transform: translateY(-2px);
        }

        /* Mobile Responsiveness */
        @media (max-width: 480px) {
            .error-container {
                padding: 30px 20px;
                margin: 15px;
            }

            h1 {
                font-size: 2rem;
            }

            .error-icon {
                font-size: 4rem;
            }

            .action-buttons {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">🚫</div>
        <h1>Access Denied</h1>
        
        <div class="error-code">Error 403</div>
        
        <div class="error-message">
            You don't have permission to access this page. Please contact your administrator if you believe this is an error.
        </div>
        
        <div class="action-buttons">
            <button class="btn btn-primary" onclick="goToLogin()">🔑 Login</button>
            <button class="btn btn-secondary" onclick="goBack()">← Go Back</button>
        </div>
    </div>

    <script>
        const appUrl = '<?= appUrl ?>';

        function goToLogin() {
            window.location.href = appUrl;
        }

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                goToLogin();
            }
        }

        // Auto-redirect after 10 seconds
        setTimeout(() => {
            const countdown = document.createElement('div');
            countdown.style.cssText = 'margin-top: 20px; color: #718096; font-size: 0.9rem;';
            countdown.innerHTML = 'Redirecting to login in <span id="timer">10</span> seconds...';
            document.querySelector('.error-container').appendChild(countdown);
            
            let timeLeft = 10;
            const timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    goToLogin();
                }
            }, 1000);
        }, 5000);
    </script>
</body>
</html>
