<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title><?= typeof companyName !== 'undefined' ? companyName : 'Inventory System' ?> - Inventory</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            font-size: 16px;
        }

        .inventory-container {
            padding: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        .header .company-logo {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header h1 {
            color: #4a5568;
            margin-bottom: 5px;
            font-size: 2rem;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .nav-btn {
            background: #4299e1;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            min-height: 44px;
        }

        .nav-btn:hover {
            background: #3182ce;
            transform: translateY(-2px);
        }

        .nav-btn.back {
            background: #38a169;
        }

        .nav-btn.add {
            background: #38a169;
        }

        .inventory-tools {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .search-bar {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .inventory-table {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f7fafc;
            font-weight: 600;
            color: #4a5568;
            position: sticky;
            top: 0;
        }

        tr:hover {
            background: #f7fafc;
        }

        .action-btn {
            background: #4299e1;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            margin: 0 2px;
        }

        .action-btn.edit {
            background: #ed8936;
        }

        .action-btn.delete {
            background: #e53e3e;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #718096;
        }

        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #4299e1;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .inventory-container {
                padding: 10px;
            }

            .nav-buttons {
                flex-direction: column;
                align-items: center;
            }

            .nav-btn {
                width: 100%;
                max-width: 300px;
            }

            table {
                font-size: 0.8rem;
            }

            th, td {
                padding: 8px 4px;
            }
        }
    </style>
</head>
<body>
    <div class="inventory-container">
        <div class="header">
            <div class="company-logo"><?= typeof logo !== 'undefined' ? logo : '📦' ?></div>
            <h1><?= typeof companyName !== 'undefined' ? companyName : 'Inventory System' ?></h1>
            <div style="color: #718096; font-style: italic;">Inventory Management</div>
            
            <div class="nav-buttons">
                <button class="nav-btn back" onclick="goToDashboard()">🏠 Dashboard</button>
                <button class="nav-btn add" onclick="addItem()">➕ Add Item</button>
                <button class="nav-btn" onclick="showReports()">📊 Reports</button>
            </div>
        </div>

        <div class="inventory-tools">
            <input type="text" class="search-bar" id="searchBar" placeholder="🔍 Search inventory..." onkeyup="filterInventory()">
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            Loading inventory...
        </div>

        <div class="inventory-table" id="inventoryTable" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>SKU</th>
                        <th>Product Name</th>
                        <th>Category</th>
                        <th>Quantity</th>
                        <th>Unit Price</th>
                        <th>Supplier</th>
                        <th>Expiry Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="inventoryBody">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const sessionToken = '<?= sessionToken ?>';
        const appUrl = '<?= appUrl ?>';
        let inventoryData = [];

        window.onload = function() {
            loadInventory();
        };

        function loadInventory() {
            fetch(appUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `action=getInventory&sessionToken=${sessionToken}`
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                if (data.success) {
                    inventoryData = data.data || [];
                    displayInventory(inventoryData);
                } else {
                    alert('Error loading inventory: ' + data.error);
                }
            })
            .catch(error => {
                document.getElementById('loading').style.display = 'none';
                console.error('Error:', error);
                alert('Error loading inventory');
            });
        }

        function displayInventory(data) {
            const tbody = document.getElementById('inventoryBody');
            const table = document.getElementById('inventoryTable');
            
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px;">No inventory items found</td></tr>';
            } else {
                data.forEach(item => {
                    const row = tbody.insertRow();
                    row.innerHTML = `
                        <td>${item.sku || ''}</td>
                        <td>${item.productName || ''}</td>
                        <td>${item.category || ''}</td>
                        <td>${item.quantity || 0}</td>
                        <td>$${item.unitPrice || 0}</td>
                        <td>${item.supplier || ''}</td>
                        <td>${item.expiryDate || ''}</td>
                        <td>
                            <button class="action-btn edit" onclick="editItem('${item.sku}')">Edit</button>
                            <button class="action-btn delete" onclick="deleteItem('${item.sku}')">Delete</button>
                        </td>
                    `;
                });
            }
            
            table.style.display = 'block';
        }

        function filterInventory() {
            const searchTerm = document.getElementById('searchBar').value.toLowerCase();
            const filteredData = inventoryData.filter(item => 
                Object.values(item).some(value => 
                    value.toString().toLowerCase().includes(searchTerm)
                )
            );
            displayInventory(filteredData);
        }

        function goToDashboard() {
            window.location.href = `${appUrl}?page=dashboard&sessionToken=${sessionToken}`;
        }

        function showReports() {
            window.location.href = `${appUrl}?page=reports&sessionToken=${sessionToken}`;
        }

        function addItem() {
            // TODO: Implement add item modal/page
            alert('Add item functionality coming soon!');
        }

        function editItem(sku) {
            // TODO: Implement edit item modal/page
            alert('Edit item functionality coming soon! SKU: ' + sku);
        }

        function deleteItem(sku) {
            if (confirm('Are you sure you want to delete this item?')) {
                // TODO: Implement delete functionality
                alert('Delete functionality coming soon! SKU: ' + sku);
            }
        }
    </script>
</body>
</html>
